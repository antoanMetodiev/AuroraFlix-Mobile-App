name: auroraflix
description: "AuroraFlix — movies & series streaming app for Android, iOS and TV."
publish_to: 'none'
version: 0.3.2+8

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^5.1.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.2
  google_fonts: 8.2.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.25
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/movies/
    - assets/series/
    - assets/player-guide/
    - shorebird.yaml
